# DOCKER_USERNAME drives the pushed image namespace (set in CI / shell).
# VITE_API_ENDPOINT is baked into the frontend bundle at build time.
services:
  backend:
    image: ${DOCKER_USERNAME:-local}/nli-synthetic-data-processing:latest
    build:
      context: ./backend
    ports:
      - "8000:8000"

  frontend:
    image: ${DOCKER_USERNAME:-local}/nli-synthetic-data-processing-frontend:latest
    build:
      context: ./frontend
      args:
        VITE_API_ENDPOINT: ${VITE_API_ENDPOINT:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
